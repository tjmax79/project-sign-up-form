<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
</head>
<body>
    
    <div class="container" tabindex="0">
     <div class="para">
        <p class="para1">This is not a real online service!You know you need something<br> like this in your life to help you realize your deepest dreams.<br>Sign up now to get started</p>
        <p class="para1 info">You know you want to.</p>
    </div>

    <div class="odin-container">   
        <div class="odin-head">
            <img src="image.png" width="40" alt="odin-logo">
        </div>
        <div>
            <p  id="imgpara">ODIN</p>
        </div>
    </div>
    <h4>Lets do this!</h4>

     <div>
        <form action="#">
            <div class="cont">  
                <div>
                    <label for="f_n">FIRST NAME</label>
                    <input type="text" name="Firstname" id="f_n" value="Tunji" >
                </div>
                <div>
                    <label for="l_n">LAST NAME</label>
                    <input type="text" id="l_n" name="lastname" value="Ogidan" >
                </div>
            </div>


             <div class="cont"> 

                  <div>
                    <label for="e_mail">EMAIL</label>
                    <input type="email" name="email" id="e_mail">
                </div>
                    <div>
                        <label for="phone_num">PHONE NUMBER</label>
                        <input type="number" id="phone_num" name="phonenum" >
                    </div>
                    
                </div>
             </div>
          
             <div  class="cont">
                <div>
                    <label for="pword">PASSWORD</label>
                    <input type="password" id="pword" name="password"  required>
                </div>
                <div>
                    <label for="cpw">CONFIRM PASSWORD</label>
                    <input type="password" id="cpw" name="password"  required>
                </div>
             </div>
             <div class="btnp">
                <button type="submit">Create Account</button>
                <p class="lastpara">Already have an account? Log in</p>
             </div>
        </form>
     </div>
   
    </div>
</body>
</html>
